<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect - Remote Screen</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --text: #f1f1f1;
      --muted: #888;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 36px;
    }

    label {
      display: block;
      text-align: left;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-align: center;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 16px;
    }

    input:focus { border-color: var(--accent); }

    button {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: var(--accent-hover); }

    .error {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }

    .download-link {
      margin-top: 28px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .download-link a {
      color: var(--accent);
      text-decoration: none;
    }

    .download-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Connect</div>
    <div class="subtitle">Введи код сессии чтобы смотреть экран</div>

    <label for="sessionInput">Код сессии</label>
    <input id="sessionInput" type="text" placeholder="AB12CD" maxlength="6" autocomplete="off" />

    <button onclick="joinSession()">Подключиться</button>
    <div class="error" id="errorMsg">Сессия не найдена</div>

    <div class="download-link">
      Хочешь показать свой экран? <a href="/viewer.html?host=1">Скачать клиент</a>
    </div>
  </div>

  <script>
    const input = document.getElementById('sessionInput');
    input.addEventListener('input', () => {
      input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') joinSession();
    });

    function joinSession() {
      const code = input.value.trim();
      if (code.length < 4) {
        showError('Введи код сессии');
        return;
      }
      window.location.href = `/viewer.html?session=${code}`;
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
